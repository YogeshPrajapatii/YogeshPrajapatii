name: Update Profile Analytics

on:
  schedule:
    # Daily at 06:00 Asia/Kolkata (00:30 UTC)
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "scripts/generate_profile_analytics.py"
      - ".github/workflows/update-profile-analytics.yml"

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate analytics from GitHub GraphQL
        env:
          GH_TOKEN: ${{ secrets.STREAK_STATS_TOKEN || github.token }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_profile_analytics.py

      - name: Commit refreshed analytics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile analytics"
          git push
